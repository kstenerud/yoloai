name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --help

      # `make check` requires hadolint (D112) and no longer skips when it is
      # absent. It previously "worked" here only because ubuntu-latest happens to
      # ship Docker and the Makefile fell back to it — an incidental property, not
      # a contract (GEN §14). Install it explicitly.
      - name: Install hadolint
        env:
          HADOLINT_VERSION: v2.14.0
        run: |
          base="https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}"
          curl -fsSL -o /tmp/hadolint "${base}/hadolint-linux-x86_64"
          curl -fsSL -o /tmp/hadolint.sha256 "${base}/hadolint-linux-x86_64.sha256"
          echo "$(cut -d' ' -f1 /tmp/hadolint.sha256)  /tmp/hadolint" | sha256sum -c -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version

      # Pinned rather than inherited from the runner image. shellcheck 0.11.0
      # narrowed SC2015, so a runner on 0.10.x and a developer's `:stable`
      # container disagree about whether the same tree passes — which is how
      # seven findings reached main through a green local `make check` (DF187).
      # The Makefile pins the same version for its container fallback.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          base="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}"
          curl -fsSL -o /tmp/shellcheck.tar.xz "${base}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install Python dev deps
        run: make setup-dev-python

      - name: Run checks
        run: make check

  # Commit messages stay PR-only, and unlike the content gates below that is a
  # deliberate scope rather than an inherited one. This repo lands most work by
  # merging a local branch and pushing, so a push range re-lints a whole branch's
  # history at merge time — commits their own PR already judged, or that predate the
  # convention. `make lint-commits` is the local half; this is the half that covers
  # an outside contribution, whose fork PR never runs .claude/hooks.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base commit to diff against

      - name: Lint commit messages
        run: |
          python3 scripts/lint_commits.py \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  # These two judge FILES, so they must see every path a file reaches main by —
  # and this repo sends small fixes straight there. They previously lived in the
  # `commits` job and silently inherited its `pull_request` guard, which was
  # written for commit linting and justified by a claim ("the range only exists for
  # a PR") that is untrue of a push. A results file pushed direct to main was never
  # examined by anything, and `k3b-veth-reuse-live-sibling.txt` is the specimen.
  #
  # Worse than not running: with `github.base_ref` empty on a push, the gates would
  # have run as `--base origin/` and EXITED 0, because git reports an unresolvable
  # ref on stderr and returns no stdout. Both scripts now refuse an unresolvable
  # ref instead of reading the resulting empty diff as a clean branch.
  content-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the base commit to diff against

      - name: Resolve the range to examine
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # A branch's first push, and a force-push whose old tip was garbage
            # collected, both leave `before` unresolvable. Fall back to the parent
            # rather than to something that silently diffs nothing.
            if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
              base="$head~1"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "examining $base..$head"

      # Rule 1, at the end where the entry is owed. The release workflow's
      # BREAKING-CHANGES check runs on a tag and asserts `## Unreleased` is EMPTY
      # — it proves entries that exist got drained, and cannot see one that was
      # never written, so it passes most loudly in the failure case. This is the
      # other half.
      - name: Require a BREAKING-CHANGES entry for a removed user-visible name
        run: |
          python3 scripts/check_breaking_changes.py \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}"

      # A results file whose bounds are unstated gets read wider than its run. The
      # two 2026-08 research passes are the controlled experiment: the one that wrote
      # these sections produced no over-broad conclusions, the one that did not
      # produced five.
      - name: Require a bounding section on new research results
        run: |
          python3 scripts/check_research_bounds.py \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}"

  # Rule 10, run rather than remembered: revert each changed file and require some
  # test to go red. PR-only and in its own job, because it builds and tests once per
  # changed file and is far too slow for `make check`.
  #
  # Validated against five merged commits before being switched on: zero false
  # positives, and four real rule-10 violations, three of them the shape the rule
  # itself warns about — the same change made in several places and tested in one.
  revert-red:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # it diffs, and it adds a worktree at the base commit

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require a test that goes red when each change is reverted
        run: |
          python3 scripts/check_revert_red.py \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build base image
        run: make base-image

      - name: Run integration tests
        # Mandatory-infra policy (D112): a platform-possible backend that's absent
        # FAILS; the only carve-out is this env, for backends THIS runner genuinely
        # cannot provision. GitHub-hosted runners give no nested KVM, so the
        # containerd Kata backend is unprovisionable here — carve it out. Docker
        # stays mandatory (provisioned on the runner); apple/seatbelt/tart are
        # macOS-only and self-exclude on Linux via their TestMain GOOS guard.
        env:
          YOLOAI_TEST_UNCONTROLLED_BACKENDS: containerd
        run: make integration

      - name: Run e2e tests
        run: make e2e

  integration-podman:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify Podman installation
        run: |
          podman version
          podman info

      - name: Start Podman socket
        run: |
          systemctl --user enable --now podman.socket
          systemctl --user status podman.socket --no-pager

      - name: Build image and run Podman integration tests
        run: make integration-podman
